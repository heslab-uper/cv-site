<main class="wrap" id="isi"><p class="kosong">Memuat data&hellip;</p></main>

<script>
'use strict';
// =====================================================================
//  Galeri grafik siap tempel untuk Laporan Evaluasi Diri.
//
//  Grafik digambar sebagai SVG murni (tanpa pustaka luar) lalu diekspor
//  ke PNG lewat canvas. Alasan SVG: teksnya tetap tajam pada skala
//  berapa pun, dan ekspor 2x membuat hasilnya layak cetak di Word.
//
//  Semua grafik memakai data agregat dari data.json — tidak ada nama
//  atau NIM mahasiswa yang pernah masuk ke halaman ini.
// =====================================================================
let D = null, MODE = 'ts', SKALA = 2;

const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const thn = x => MODE === 'ts' ? +(x.tahun_ts ?? x.tahun) : +x.tahun;
const labelThn = t => MODE === 'ts' ? `${String(t-1).slice(2)}/${String(t).slice(2)}` : String(t);
const WARNA = ['#0C2A4D', '#5C86B0', '#00954E', '#B8860B', '#C8102E', '#6B4E9B'];

// Tiga periode terakhir yang ada datanya, ditambah satu tahun kosong di
// tengah bila ada lompatan, supaya sumbu waktu tidak menipu.
function tahunDeret(n){
  const th = new Set();
  // Semua sumber bertahun ikut menentukan sumbu — kalau hanya luaran atau
  // rekognisi yang terisi, grafiknya tetap punya rentang waktu.
  [D.publikasi, D.kegiatan, D.prestasi_agregat, D.luaran_dosen,
   D.rekognisi, D.integrasi, D.mahasiswa_agregat]
    .forEach(arr => (arr || []).forEach(x => th.add(thn(x))));
  ((D.akreditasi || {}).ta || []).forEach(r => th.add(r.tahun_ts));
  const ada = [...th].filter(Boolean).sort((a, b) => a - b);
  if (!ada.length) return [];
  const ahir = ada[ada.length - 1];
  return Array.from({length: n}, (_, i) => ahir - n + 1 + i);
}

// ---------------------------------------------------------------------
//  Primitif gambar
// ---------------------------------------------------------------------
const P = {l: 52, r: 16, t: 16, b: 40};     // padding plot
const W = 560, H = 320;

function rangka(judul, isi, sumbuY){
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <rect width="${W}" height="${H}" fill="#ffffff"/>
    ${sumbuY || ''}${isi}</svg>`;
}

function skalaY(maks){
  // Bulatkan batas atas ke angka "enak" supaya garis bantu bermakna.
  if (maks <= 0) return {maks: 1, langkah: 1};
  const kasar = maks / 4;
  const pangkat = Math.pow(10, Math.floor(Math.log10(kasar)));
  const langkah = [1, 2, 2.5, 5, 10].map(x => x * pangkat)
    .find(x => x >= kasar) || pangkat * 10;
  return {maks: Math.ceil(maks / langkah) * langkah, langkah};
}

function sumbu(maks, langkah, label){
  const th = H - P.b, tinggi = th - P.t;
  let g = '';
  for (let v = 0; v <= maks + 1e-9; v += langkah){
    const y = th - (v / maks) * tinggi;
    g += `<line x1="${P.l}" y1="${y}" x2="${W - P.r}" y2="${y}"
            stroke="${v === 0 ? '#D9DFDA' : '#EBEEEB'}" stroke-width="1"/>
          <text x="${P.l - 8}" y="${y + 4}" text-anchor="end" font-size="11"
            fill="#5D6B78">${Number.isInteger(v) ? v : v.toFixed(1)}</text>`;
  }
  if (label) g += `<text x="14" y="${P.t + tinggi / 2}" font-size="11" fill="#5D6B78"
    text-anchor="middle" transform="rotate(-90 14 ${P.t + tinggi / 2})">${esc(label)}</text>`;
  return g;
}

function labelX(kat){
  const th = H - P.b, lebar = (W - P.l - P.r) / kat.length;
  return kat.map((k, i) =>
    `<text x="${P.l + lebar * (i + .5)}" y="${th + 20}" text-anchor="middle"
       font-size="11.5" fill="#14212E">${esc(k)}</text>`).join('');
}

function legenda(seri){
  return seri.map((s, i) =>
    `<g transform="translate(${P.l + i * 132}, ${H - 8})">
      <rect width="10" height="10" y="-9" fill="${s.warna || WARNA[i]}" rx="1"/>
      <text x="15" y="0" font-size="11" fill="#14212E">${esc(s.nama)}</text>
    </g>`).join('');
}

// Batang berkelompok
function batang(kat, seri, satuan){
  const semua = seri.flatMap(s => s.nilai);
  const {maks, langkah} = skalaY(Math.max(...semua, 0));
  const th = H - P.b, tinggi = th - P.t;
  const lebarKat = (W - P.l - P.r) / kat.length;
  const lebarBar = Math.min(38, (lebarKat * .68) / seri.length);
  let g = '';
  kat.forEach((_, i) => {
    seri.forEach((s, j) => {
      const v = s.nilai[i] || 0;
      const h = (v / maks) * tinggi;
      const x = P.l + lebarKat * (i + .5) - (lebarBar * seri.length) / 2 + lebarBar * j;
      g += `<rect x="${x}" y="${th - h}" width="${lebarBar - 3}" height="${h}"
              fill="${s.warna || WARNA[j]}" rx="1"/>`;
      if (v > 0) g += `<text x="${x + (lebarBar - 3) / 2}" y="${th - h - 5}"
        text-anchor="middle" font-size="10.5" fill="#5D6B78">${v}</text>`;
    });
  });
  return rangka('', g + labelX(kat) + (seri.length > 1 ? legenda(seri) : ''),
                sumbu(maks, langkah, satuan));
}

// Garis (untuk tren skor / rasio)
function garis(kat, seri, satuan, maksTetap){
  const semua = seri.flatMap(s => s.nilai.filter(v => v != null));
  const {maks, langkah} = maksTetap
    ? {maks: maksTetap, langkah: maksTetap / 4}
    : skalaY(Math.max(...semua, 0));
  const th = H - P.b, tinggi = th - P.t;
  const lebar = (W - P.l - P.r) / kat.length;
  const px = i => P.l + lebar * (i + .5);
  const py = v => th - (v / maks) * tinggi;
  let g = '';
  seri.forEach((s, j) => {
    const titik = s.nilai.map((v, i) => v == null ? null : [px(i), py(v)]).filter(Boolean);
    if (titik.length > 1)
      g += `<polyline fill="none" stroke="${s.warna || WARNA[j]}" stroke-width="2.5"
              stroke-linejoin="round" points="${titik.map(p => p.join(',')).join(' ')}"/>`;
    s.nilai.forEach((v, i) => {
      if (v == null) return;
      g += `<circle cx="${px(i)}" cy="${py(v)}" r="4" fill="#fff"
              stroke="${s.warna || WARNA[j]}" stroke-width="2.5"/>
            <text x="${px(i)}" y="${py(v) - 11}" text-anchor="middle" font-size="10.5"
              fill="#5D6B78">${Number.isInteger(v) ? v : v.toFixed(2)}</text>`;
    });
  });
  return rangka('', g + labelX(kat) + (seri.length > 1 ? legenda(seri) : ''),
                sumbu(maks, langkah, satuan));
}

// Batang bertumpuk horizontal (komposisi)
function tumpuk(baris, kunci, warna){
  const tinggiBaris = 34, atas = 14;
  const tinggi = atas + baris.length * tinggiBaris + 26;
  const maks = Math.max(...baris.map(b => kunci.reduce((a, k) => a + (b[k.k] || 0), 0)), 1);
  const kiri = 96, kanan = W - 16;
  let g = '';
  baris.forEach((b, i) => {
    const y = atas + i * tinggiBaris;
    let x = kiri;
    g += `<text x="${kiri - 10}" y="${y + 17}" text-anchor="end" font-size="11.5"
            fill="#14212E">${esc(b.label)}</text>`;
    kunci.forEach((k, j) => {
      const v = b[k.k] || 0;
      if (!v) return;
      const w = (v / maks) * (kanan - kiri);
      g += `<rect x="${x}" y="${y}" width="${w}" height="22" fill="${warna[j]}" rx="1"/>`;
      if (w > 22) g += `<text x="${x + w / 2}" y="${y + 15}" text-anchor="middle"
        font-size="10.5" fill="#fff">${v}</text>`;
      x += w;
    });
  });
  g += kunci.map((k, j) =>
    `<g transform="translate(${kiri + j * 126}, ${tinggi - 8})">
      <rect width="10" height="10" y="-9" fill="${warna[j]}" rx="1"/>
      <text x="15" y="0" font-size="11" fill="#14212E">${esc(k.n)}</text></g>`).join('');
  return `<svg viewBox="0 0 ${W} ${tinggi}" xmlns="http://www.w3.org/2000/svg">
    <rect width="${W}" height="${tinggi}" fill="#ffffff"/>${g}</svg>`;
}

// ---------------------------------------------------------------------
//  Ekspor PNG — SVG dirender ke canvas pada skala pilihan.
// ---------------------------------------------------------------------
function unduhPNG(svgEl, namaBerkas){
  const kode = new XMLSerializer().serializeToString(svgEl);
  const vb = svgEl.viewBox.baseVal;
  const img = new Image();
  const blob = new Blob([kode], {type: 'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = vb.width * SKALA; c.height = vb.height * SKALA;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    c.toBlob(b => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = namaBerkas + '.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  };
  img.onerror = () => alert('Gagal menyiapkan gambar. Coba muat ulang halaman.');
  img.src = url;
}

function salinPNG(svgEl, tombol){
  const kode = new XMLSerializer().serializeToString(svgEl);
  const vb = svgEl.viewBox.baseVal;
  const img = new Image();
  const url = URL.createObjectURL(new Blob([kode], {type: 'image/svg+xml;charset=utf-8'}));
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = vb.width * SKALA; c.height = vb.height * SKALA;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    c.toBlob(async b => {
      try {
        await navigator.clipboard.write([new ClipboardItem({'image/png': b})]);
        const t = tombol.textContent; tombol.textContent = 'Tersalin';
        setTimeout(() => tombol.textContent = t, 1600);
      } catch {
        alert('Peramban ini tidak mengizinkan salin gambar. Pakai tombol Unduh PNG.');
      }
    }, 'image/png');
  };
  img.src = url;
}

// ---------------------------------------------------------------------
//  Definisi grafik
// ---------------------------------------------------------------------
function grafikPublikasi(th){
  const kat = th.map(labelThn);
  const jenis = [
    {n: 'Internasional bereputasi', f: p => (p.indeksasi||'').match(/scopus|wos|bereputasi/i) || (p.tingkat||'').match(/bereputasi/i)},
    {n: 'Internasional lain',       f: p => (p.tingkat||'').match(/internasional/i)},
    {n: 'Nasional',                 f: p => true},
  ];
  const seri = jenis.map((j, idx) => ({nama: j.n, warna: WARNA[idx], nilai: th.map(t =>
    (D.publikasi || []).filter(p => thn(p) === t).filter(p => {
      for (let i = 0; i < jenis.length; i++)
        if (jenis[i].f(p)) return i === idx;
      return false;
    }).length)}));
  return {svg: batang(kat, seri, 'judul'),
    kaki: 'Publikasi terverifikasi. Kategori mengikuti kolom tingkat dan indeksasi.'};
}

function grafikKegiatan(th){
  const kat = th.map(labelThn);
  const seri = [
    {nama: 'Penelitian', warna: WARNA[0], nilai: th.map(t =>
      (D.kegiatan || []).filter(k => thn(k) === t && k.kategori === 'penelitian').length)},
    {nama: 'PkM', warna: WARNA[2], nilai: th.map(t =>
      (D.kegiatan || []).filter(k => thn(k) === t && k.kategori === 'pkm').length)},
  ];
  return {svg: batang(kat, seri, 'judul'),
    kaki: 'Kegiatan terverifikasi, dihitung per judul kegiatan.'};
}

function grafikDTPS(){
  const T = D.dtps || {}, jab = T.jabatan || {};
  const n = T.jumlah || 0;
  if (!n) return null;
  const baris = [
    {label: 'Pendidikan', s3: T.doktor || 0, s2: n - (T.doktor || 0)},
    {label: 'Jabatan', gb: (jab.guru_besar||0) + (jab.lektor_kepala||0) + (jab.lektor||0),
     lain: n - ((jab.guru_besar||0) + (jab.lektor_kepala||0) + (jab.lektor||0))},
  ];
  const svg = tumpuk(
    [{label: 'Pendidikan', a: baris[0].s3, b: baris[0].s2},
     {label: 'Jabatan',    a: baris[1].gb, b: baris[1].lain}],
    [{k: 'a', n: 'Doktor / Lektor ke atas'}, {k: 'b', n: 'Lainnya'}],
    [WARNA[0], '#D9DFDA']);
  return {svg, kaki: `Komposisi ${n} DTPS pada keadaan terkini. `
    + `Butir 27 menuntut ≥ 50% doktor untuk skor 4; butir 28 menuntut ≥ 70% Lektor ke atas.`};
}

function grafikPrestasi(th){
  const kat = th.map(labelThn);
  const pres = D.prestasi_agregat || [];
  const isAka = p => String(p.bidang||'').startsWith('akademik');
  const jml = (t, f) => pres.filter(p => thn(p) === t && f(p))
                            .reduce((a, b) => a + b.jumlah, 0);
  const seri = [
    {nama: 'Akademik', warna: WARNA[0], nilai: th.map(t => jml(t, isAka))},
    {nama: 'Non-akademik', warna: WARNA[3], nilai: th.map(t => jml(t, p => !isAka(p)))},
  ];
  if (!seri.some(s => s.nilai.some(v => v > 0))) return null;
  return {svg: batang(kat, seri, 'prestasi'),
    kaki: 'Butir 43 menimbang prestasi akademik tiga kali lebih berat.'};
}

function grafikMahasiswaKarya(th){
  const kat = th.map(labelThn);
  const agg = D.mahasiswa_agregat || [];
  const jml = (t, k) => agg.filter(x => thn(x) === t && x.kategori === k)
                           .reduce((a, b) => a + b.keterlibatan, 0);
  const seri = [
    {nama: 'Publikasi', warna: WARNA[0], nilai: th.map(t => jml(t, 'publikasi'))},
    {nama: 'Penelitian', warna: WARNA[1], nilai: th.map(t => jml(t, 'penelitian'))},
    {nama: 'PkM', warna: WARNA[2], nilai: th.map(t => jml(t, 'pkm'))},
  ];
  if (!seri.some(s => s.nilai.some(v => v > 0))) return null;
  return {svg: batang(kat, seri, 'keterlibatan'),
    kaki: 'Jumlah keterlibatan mahasiswa pada karya dosen (butir 23, 25, 46).'};
}

function grafikTracer(){
  const tr = (D.tracer || []).slice().sort((a, b) => a.tahun_lulus - b.tahun_lulus);
  if (!tr.length) return null;
  const kat = tr.map(t => String(t.tahun_lulus));
  const seri = [
    {nama: 'Waktu tunggu (bulan)', warna: WARNA[4],
     nilai: tr.map(t => t.terlacak ? +(t.waktu_tunggu_bulan || 0).toFixed(1) : null)},
    {nama: 'Sesuai bidang (%)', warna: WARNA[2],
     nilai: tr.map(t => t.terlacak ? Math.round((t.sesuai_bidang / t.terlacak) * 100) : null)},
  ];
  return {svg: garis(kat, seri, ''),
    kaki: 'Sumbu berbagi skala; perhatikan satuan tiap seri. '
        + 'Butir 49 menuntut ≤ 3 bulan, butir 50 ≥ 60% untuk skor 4.'};
}

function grafikMitra(th){
  const K = ((D.akreditasi || {}).kerjasama) || [];
  const pilih = K.filter(k => th.includes(k.tahun));
  if (!pilih.length) return null;
  const baris = th.map(t => {
    const r = K.find(x => x.tahun === t) || {};
    return {label: labelThn(t), a: r.internasional || 0,
            b: r.nasional || 0, c: r.wilayah || 0};
  });
  return {svg: tumpuk(baris,
      [{k:'a',n:'Internasional'},{k:'b',n:'Nasional'},{k:'c',n:'Wilayah'}],
      [WARNA[0], WARNA[1], WARNA[3]]),
    kaki: 'Kerja sama aktif per periode (butir 6). Sumber: mitra pada karya + lembar kerjasama.'};
}


// ---------------------------------------------------------------------
//  Grafik tambahan — muncul sendiri begitu sumber datanya terisi.
// ---------------------------------------------------------------------

// Butir 34 & 47 — luaran per jenis (bobot NLP: paten 3, TTG/buku 2, HKI 1)
function grafikLuaran(th){
  const kat = th.map(labelThn);
  const PETA = {paten:'paten', paten_sederhana:'paten', ttg:'ttg',
    teknologi_tepat_guna:'ttg', produk:'ttg', buku_isbn:'bc', buku:'bc',
    book_chapter:'bc', bab_buku:'bc', hak_cipta:'hki'};
  const kel = (l) => PETA[(l.jenis||'').toLowerCase()] || null;
  const jml = (t, k) => (D.luaran_dosen||[]).filter(l => thn(l)===t && kel(l)===k).length;
  const seri = [
    {nama:'Paten', warna:WARNA[0], nilai: th.map(t=>jml(t,'paten'))},
    {nama:'TTG / produk', warna:WARNA[1], nilai: th.map(t=>jml(t,'ttg'))},
    {nama:'Buku / bab', warna:WARNA[2], nilai: th.map(t=>jml(t,'bc'))},
    {nama:'Hak cipta', warna:WARNA[3], nilai: th.map(t=>jml(t,'hki'))},
  ];
  if(!seri.some(x=>x.nilai.some(v=>v>0))) return null;
  return {svg: batang(kat, seri, 'luaran'),
    kaki:'Butir 34 (RLP) menimbang paten 3&times;, TTG/produk dan buku 2&times;, '
       + 'hak cipta 1&times;. Jenis lain tidak menyumbang skor.'};
}

// Butir 35 — DTPS dengan karya utama internasional (jendela 3 TS bergulir)
function grafikKaryaUtama(th){
  const rinci = (D.dtps||{}).karya_utama_rinci;
  const n = (D.dtps||{}).jumlah || 0;
  if(!Array.isArray(rinci) || !n || !rinci.length) return null;
  const nilai = th.map(t => {
    const org = new Set(rinci.filter(x => x.tahun >= t-2 && x.tahun <= t).map(x=>x.slug));
    return Math.round((org.size / n) * 100);
  });
  return {svg: garis(th.map(labelThn),
      [{nama:'PKDTPS (%)', warna:WARNA[0], nilai},
       {nama:'Ambang skor 4 (50%)', warna:'#C8102E',
        nilai: th.map(()=>50)}], '%', 100),
    kaki:`Persentase dari ${n} DTPS yang punya karya sebagai penulis pertama/`
       + 'korespondensi di jurnal internasional bereputasi, prosiding terindeks, '
       + 'atau paten — jendela tiga tahun bergulir tiap titik.'};
}

// Butir 37 — rekognisi DTPS per tingkat
function grafikRekognisi(th){
  const R = D.rekognisi || [];
  if(!R.length) return null;
  const tk = r => { const t=(r.tingkat||'').toLowerCase();
    return t.includes('internasional') ? 'i' : t.includes('nasional') ? 'n' : 'w'; };
  const jml = (t,k) => R.filter(r => thn(r)===t && tk(r)===k).length;
  const seri = [
    {nama:'Internasional', warna:WARNA[0], nilai: th.map(t=>jml(t,'i'))},
    {nama:'Nasional', warna:WARNA[1], nilai: th.map(t=>jml(t,'n'))},
    {nama:'Wilayah', warna:WARNA[3], nilai: th.map(t=>jml(t,'w'))},
  ];
  if(!seri.some(x=>x.nilai.some(v=>v>0))) return null;
  return {svg: batang(th.map(labelThn), seri, 'rekognisi'),
    kaki:'Visiting lecturer, keynote/invited speaker, editor/mitra bestari, '
       + 'tenaga ahli, dan penghargaan (butir 37).'};
}

// Butir 40 & 42 — rasio mahasiswa:DTPS dan IPK lulusan
function grafikMahasiswaTA(){
  const ta = ((D.akreditasi||{}).ta || []).slice()
    .filter(r => r.mahasiswa_aktif > 0 || r.rerata_ipk > 0)
    .sort((a,b)=>a.tahun_ts-b.tahun_ts);
  if(!ta.length) return null;
  const n = (D.dtps||{}).jumlah || 0;
  const seri = [
    {nama:'Rasio mahasiswa : DTPS', warna:WARNA[0],
     nilai: ta.map(r => n && r.mahasiswa_aktif ? +(r.mahasiswa_aktif/n).toFixed(1) : null)},
    {nama:'Rerata IPK lulusan', warna:WARNA[2],
     nilai: ta.map(r => r.rerata_ipk > 0 ? +r.rerata_ipk.toFixed(2) : null)},
  ];
  if(!seri.some(x=>x.nilai.some(v=>v!=null))) return null;
  return {svg: garis(ta.map(r=>r.ta.replace(/^\d{2}/,'').replace(/\/\d{2}/,'/'+r.ta.slice(-2))), seri, ''),
    kaki:'Butir 40 menilai rasio ideal 15–25 dengan NDTPS ≥ 12; butir 42 '
       + 'menuntut RIPK ≥ 3,25 untuk skor 4. Perhatikan satuan tiap seri.'};
}

// Butir 44 & 45 — masa studi dan kelulusan tepat waktu per kohort
function grafikKohort(){
  const K = ((D.akreditasi||{}).kohort || []).slice()
    .filter(k => k.masuk > 0 && k.lulus > 0)
    .sort((a,b)=>a.tahun_masuk-b.tahun_masuk);
  if(!K.length) return null;
  return {svg: garis(K.map(k=>'A'+String(k.tahun_masuk).slice(2)),
    [{nama:'Masa studi (tahun)', warna:WARNA[0],
      nilai: K.map(k=>+k.ms_tertimbang.toFixed(2))},
     {nama:'Lulus tepat waktu (%)', warna:WARNA[2],
      nilai: K.map(k=>Math.round((k.lulus_3_5_sd_4_5/k.masuk)*100))}], ''),
    kaki:'Per angkatan masuk (Tabel 6.d). Butir 44 optimal pada 3,5–4,5 tahun; '
       + 'butir 45 menuntut ≥ 50% lulus tepat waktu. Angkatan termuda '
       + 'belum lengkap kelulusannya.'};
}

// Butir 17 — integrasi penelitian/PkM ke mata kuliah
function grafikIntegrasi(th){
  const I = D.integrasi || [];
  if(!I.length) return null;
  const seri = [
    {nama:'Dari penelitian', warna:WARNA[0],
     nilai: th.map(t=>I.filter(x=>thn(x)===t && (x.bentuk||'').includes('peneliti')).length)},
    {nama:'Dari PkM', warna:WARNA[2],
     nilai: th.map(t=>I.filter(x=>thn(x)===t && (x.bentuk||'').includes('pkm')).length)},
  ];
  if(!seri.some(x=>x.nilai.some(v=>v>0))) return null;
  return {svg: batang(th.map(labelThn), seri, 'mata kuliah'),
    kaki:'Hasil penelitian/PkM yang menjadi bahan ajar (butir 17). '
       + 'Instrumen menuntut ≥ 10% dari mata kuliah inti prodi.'};
}

// Butir 51 — tingkat tempat kerja lulusan
function grafikTempatKerja(){
  const tr = (D.tracer||[]).filter(t =>
    (t.kerja_internasional||0)+(t.kerja_nasional||0)+(t.kerja_wilayah||0) > 0)
    .sort((a,b)=>b.tahun_lulus-a.tahun_lulus);
  if(!tr.length) return null;
  return {svg: tumpuk(tr.map(t=>({label:'Lulus '+t.tahun_lulus,
      a:t.kerja_internasional||0, b:t.kerja_nasional||0, c:t.kerja_wilayah||0})),
    [{k:'a',n:'Multinasional'},{k:'b',n:'Nasional'},{k:'c',n:'Wilayah'}],
    [WARNA[0], WARNA[1], WARNA[3]]),
    kaki:'Butir 51, faktor a=5% b=20% c=90% terhadap jumlah lulusan.'};
}

// Ringkas semua butir kuantitatif — capaian vs ambang skor 4
function grafikCakupan(){
  const A = (D.akreditasi||{});
  const n = (D.dtps||{}).jumlah || 0;
  const jab = (D.dtps||{}).jabatan || {};
  const item = [
    {n:'DTPS doktor (b.27)', v: n ? Math.round(((D.dtps||{}).doktor||0)/n*100) : null, amb:50},
    {n:'Lektor ke atas (b.28)', v: n ? Math.round(((jab.lektor||0)+(jab.lektor_kepala||0)+(jab.guru_besar||0))/n*100) : null, amb:70},
  ];
  const ta = (A.ta||[]).slice().sort((a,b)=>b.tahun_ts-a.tahun_ts)[0];
  if(ta && ta.rerata_ipk > 0)
    item.push({n:'RIPK lulusan (b.42)', v:+(ta.rerata_ipk/4*100).toFixed(0), amb:81,
               teks:ta.rerata_ipk.toFixed(2)});
  const rinci = (D.dtps||{}).karya_utama_rinci;
  if(Array.isArray(rinci) && n){
    const t = Math.max(...rinci.map(x=>x.tahun), 0);
    const org = new Set(rinci.filter(x=>x.tahun>=t-2).map(x=>x.slug));
    item.push({n:'Karya utama int. (b.35)', v:Math.round(org.size/n*100), amb:50});
  }
  const pakai = item.filter(x=>x.v!=null);
  if(!pakai.length) return null;
  // batang horizontal dengan penanda ambang
  const tb = 40, tinggi = 14 + pakai.length*tb + 26, kiri = 158, kanan = W-46;
  let g = '';
  pakai.forEach((it,i)=>{
    const y = 14 + i*tb;
    const w = (Math.min(it.v,100)/100)*(kanan-kiri);
    const xa = kiri + (it.amb/100)*(kanan-kiri);
    const lolos = it.v >= it.amb;
    g += `<text x="${kiri-10}" y="${y+16}" text-anchor="end" font-size="11.5"
            fill="#14212E">${esc(it.n)}</text>
          <rect x="${kiri}" y="${y}" width="${kanan-kiri}" height="22" fill="#EBEEEB" rx="1"/>
          <rect x="${kiri}" y="${y}" width="${w}" height="22" rx="1"
            fill="${lolos ? '#00954E' : '#5C86B0'}"/>
          <line x1="${xa}" y1="${y-3}" x2="${xa}" y2="${y+25}" stroke="#C8102E"
            stroke-width="2" stroke-dasharray="3 2"/>
          <text x="${kanan+6}" y="${y+16}" font-size="11" fill="#5D6B78">${
            it.teks || it.v+'%'}</text>`;
  });
  g += `<g transform="translate(${kiri}, ${tinggi-8})">
      <line x1="0" y1="-4" x2="0" y2="4" stroke="#C8102E" stroke-width="2"/>
      <text x="8" y="0" font-size="11" fill="#14212E">garis merah = ambang skor 4</text></g>`;
  return {svg:`<svg viewBox="0 0 ${W} ${tinggi}" xmlns="http://www.w3.org/2000/svg">
      <rect width="${W}" height="${tinggi}" fill="#ffffff"/>${g}</svg>`,
    kaki:'Capaian terkini dibanding ambang skor 4 tiap butir. RIPK '
       + 'ditampilkan sebagai persentase dari 4,00.'};
}

// ---------------------------------------------------------------------
//  Rangka halaman
// ---------------------------------------------------------------------
function render(){
  const th = tahunDeret(5);
  const daftar = [
    {id:'publikasi', judul:'Publikasi DTPS per kategori',
     ket:'Mendukung narasi butir 33 dan kriteria Kinerja DTPS.', f:()=>grafikPublikasi(th)},
    {id:'kegiatan', judul:'Penelitian dan PkM DTPS',
     ket:'Mendukung narasi butir 31, 32, dan kriteria Penelitian/PkM.', f:()=>grafikKegiatan(th)},
    {id:'dtps', judul:'Komposisi DTPS',
     ket:'Mendukung narasi kriteria Sumber Daya Manusia (butir 27, 28).', f:grafikDTPS},
    {id:'kerjasama', judul:'Kerja sama menurut tingkat',
     ket:'Mendukung narasi butir 6 dan kriteria Kerja Sama.', f:()=>grafikMitra(th)},
    {id:'prestasi', judul:'Prestasi mahasiswa',
     ket:'Mendukung narasi butir 43 dan kriteria Mahasiswa.', f:()=>grafikPrestasi(th)},
    {id:'mahasiswa-karya', judul:'Keterlibatan mahasiswa pada karya dosen',
     ket:'Mendukung narasi butir 23, 25, dan 46.', f:()=>grafikMahasiswaKarya(th)},
    {id:'tracer', judul:'Waktu tunggu dan kesesuaian bidang kerja',
     ket:'Mendukung narasi butir 49 dan 50, kriteria Luaran.', f:grafikTracer},
    {id:'luaran', judul:'Luaran penelitian dan PkM per jenis',
     ket:'Mendukung narasi butir 34 dan 47.', f:()=>grafikLuaran(th)},
    {id:'karya-utama', judul:'DTPS dengan karya utama internasional',
     ket:'Mendukung narasi butir 35 dan syarat perlu peringkat.', f:()=>grafikKaryaUtama(th)},
    {id:'rekognisi', judul:'Rekognisi DTPS per tingkat',
     ket:'Mendukung narasi butir 37.', f:()=>grafikRekognisi(th)},
    {id:'integrasi', judul:'Integrasi penelitian/PkM ke mata kuliah',
     ket:'Mendukung narasi butir 17 dan kriteria Pendidikan.', f:()=>grafikIntegrasi(th)},
    {id:'mahasiswa-ta', judul:'Rasio mahasiswa dan IPK lulusan',
     ket:'Mendukung narasi butir 40 dan 42.', f:grafikMahasiswaTA},
    {id:'kohort', judul:'Masa studi dan kelulusan tepat waktu',
     ket:'Mendukung narasi butir 44 dan 45.', f:grafikKohort},
    {id:'tempat-kerja', judul:'Tingkat tempat kerja lulusan',
     ket:'Mendukung narasi butir 51.', f:grafikTempatKerja},
    {id:'cakupan', judul:'Capaian terhadap ambang skor 4',
     ket:'Ringkas beberapa butir kunci — berguna untuk bagian evaluasi capaian kinerja.',
     f:grafikCakupan},
  ];

  const kartu = daftar.map(g => {
    const hasil = g.f();
    const isi = hasil
      ? `<div class="svg-wadah">${hasil.svg}</div>
         <p class="kaki">${hasil.kaki}</p>
         <div class="aksi">
           <button data-unduh="${g.id}">Unduh PNG</button>
           <button data-salin="${g.id}">Salin ke papan klip</button>
         </div>`
      : `<p class="kosong">Data belum tersedia. Grafik muncul otomatis
         setelah sumbernya terisi.</p>`;
    return `<section class="kartu" data-g="${g.id}">
      <h2>${esc(g.judul)}</h2><p class="ket">${esc(g.ket)}</p>${isi}</section>`;
  }).join('');

  document.getElementById('isi').innerHTML = `
    <div class="catatan"><b>Cara pakai untuk LED.</b> Klik <i>Unduh PNG</i> untuk
    menyimpan berkas gambar, atau <i>Salin ke papan klip</i> lalu tempel langsung
    ke Word. Skala 2&times; sudah memadai untuk cetak; pilih 3&times; bila gambar akan
    dibesarkan satu halaman penuh. Semua grafik memakai angka agregat —
    tidak memuat nama atau NIM mahasiswa.</div>
    <div class="grid">${kartu}</div>
    <footer>Diperbarui ${esc(D.diperbarui || '')} ·
    Angka mengikuti mode ${MODE === 'ts' ? 'tahun akademik (TS)' : 'tahun kalender'}
    yang dipilih di atas · Grafik ini alat bantu penulisan LED, bukan dokumen resmi.</footer>`;

  document.querySelectorAll('[data-unduh]').forEach(b => b.onclick = () => {
    const svg = b.closest('.kartu').querySelector('svg');
    unduhPNG(svg, 'grafik-' + b.dataset.unduh + '-' + (MODE === 'ts' ? 'ts' : 'kal'));
  });
  document.querySelectorAll('[data-salin]').forEach(b => b.onclick = () =>
    salinPNG(b.closest('.kartu').querySelector('svg'), b));
}

function pasangKendali(){
  const w = document.getElementById('kendali');
  w.innerHTML = `<span class="lbl">Periode</span>
    <button data-m="kal" aria-pressed="${MODE==='kal'}">Tahun</button>
    <button data-m="ts" aria-pressed="${MODE==='ts'}">TS</button>
    <span class="lbl" style="margin-left:14px">Skala ekspor</span>
    ${[1,2,3].map(s=>`<button data-s="${s}" aria-pressed="${SKALA===s}">${s}&times;</button>`).join('')}`;
  w.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    MODE = b.dataset.m; pasangKendali(); render(); });
  w.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
    SKALA = +b.dataset.s; pasangKendali(); });
}

fetch('data.json?v=' + Date.now())
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    D = d;
    document.getElementById('nama-prodi').textContent =
      [d.prodi, d.institusi].filter(Boolean).join(' — ');
    pasangKendali(); render();
  })
  .catch(() => {
    document.getElementById('isi').innerHTML =
      `<p class="kosong">Gagal memuat <code>data.json</code>. Jalankan bangun.py
       lalu unggah hasilnya ke folder yang sama dengan halaman ini.</p>`;
  });
</script>
