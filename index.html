<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinerja Program Studi</title>
<meta name="description" content="Publikasi, penelitian, pengabdian masyarakat, dan prestasi mahasiswa program studi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF0ED; --panel:#fff; --ink:#161E26; --muted:#616C76;
    --line:#D8DDD8; --line-soft:#E8EBE7; --accent:#0E534C; --accent-soft:#E2ECEA;
    --sans:'IBM Plex Sans',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --serif:'IBM Plex Serif',Georgia,serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
       font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1020px;margin:0 auto;padding:0 20px 90px}
  a{color:var(--accent)}

  .hero{background:var(--panel);border-bottom:1px solid var(--line)}
  .hero-in{max-width:1020px;margin:0 auto;padding:44px 20px 38px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;
           text-transform:uppercase;color:var(--accent)}
  h1{font-family:var(--serif);font-size:clamp(26px,4.4vw,38px);font-weight:600;
     letter-spacing:-.015em;margin:8px 0 0;line-height:1.15}
  .inst{color:var(--muted);font-size:15px;margin-top:6px}

  /* angka utama dibaca sebagai satu baris data, bukan kartu terpisah */
  .angka{display:flex;flex-wrap:wrap;gap:0;margin-top:34px;border-top:1px solid var(--line)}
  .angka div{flex:1 1 150px;padding:16px 20px 14px;border-right:1px solid var(--line-soft)}
  .angka div:last-child{border-right:0}
  .angka b{display:block;font-family:var(--mono);font-size:30px;font-weight:400;
           letter-spacing:-.02em;line-height:1}
  .angka span{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
              text-transform:uppercase;color:var(--muted);display:block;margin-top:7px}

  .bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:34px 0 4px}
  .bar h2{font-family:var(--serif);font-size:20px;font-weight:600;margin:0;flex:1}
  select,input[type=search]{font-family:var(--sans);font-size:13.5px;padding:6px 10px;
    border:1px solid var(--line);border-radius:2px;background:#fff;color:var(--ink)}
  input[type=search]{min-width:200px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  .list{background:var(--panel);border:1px solid var(--line);border-radius:2px;
        padding:4px 22px;margin-top:14px}
  .e{display:flex;gap:16px;padding:15px 0;border-top:1px solid var(--line-soft)}
  .e:first-child{border-top:0}
  .thn{font-family:var(--mono);font-size:13px;color:var(--muted);flex:none;width:42px;padding-top:1px}
  .e-b{flex:1;min-width:0}
  .e-j{font-weight:500;line-height:1.4}
  .e-m{font-size:13px;color:var(--muted);margin-top:3px}
  .e-p{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:5px}
  .pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
        padding:2px 7px;border-radius:2px;background:var(--accent-soft);color:var(--accent);
        white-space:nowrap;align-self:flex-start;margin-top:2px}
  .kosong{color:var(--muted);font-size:13.5px;padding:22px 0}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
     color:var(--muted);text-align:left;font-weight:400;padding:12px 10px 10px 0;
     border-bottom:1px solid var(--line)}
  td{padding:10px 10px 10px 0;border-bottom:1px solid var(--line-soft)}
  td.num,th.num{text-align:right;font-family:var(--mono);padding-right:0}
  .dsn{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0}
  .dsn div{padding:13px 16px 13px 0}
  .dsn b{font-weight:500;display:block}
  .dsn a{font-family:var(--mono);font-size:11px;margin-right:10px;text-decoration:none}
  .dsn a:hover{text-decoration:underline}

  footer{margin-top:52px;padding-top:20px;border-top:1px solid var(--line);
         font-size:12.5px;color:var(--muted)}
  @media(max-width:560px){.angka div{flex-basis:50%;border-bottom:1px solid var(--line-soft)}}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-in">
    <div class="eyebrow">Kinerja program studi</div>
    <h1 id="hProdi">Memuat…</h1>
    <div class="inst" id="hInst"></div>
    <div class="angka" id="angka"></div>
  </div>
</header>

<main class="wrap" id="isi"></main>

<script>
const N = n => new Intl.NumberFormat('id-ID').format(n);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rapi = s => s ? String(s).replace(/_/g,' ') : '';

let D = null;

fetch('data.json')
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { D = d; render(); })
  .catch(() => {
    document.getElementById('hProdi').textContent = 'Data belum tersedia';
    document.getElementById('isi').innerHTML =
      `<p class="kosong">Berkas <code>data.json</code> belum ada di folder ini.
       Jalankan <code>python bangun.py</code> lalu unggah hasilnya.</p>`;
  });

function render(){
  document.getElementById('hProdi').textContent = D.prodi;
  document.getElementById('hInst').textContent = D.institusi || '';

  const totalPrestasi = (D.prestasi_agregat||[]).reduce((a,b)=>a+b.jumlah,0);
  const angka = [
    [D.dosen.length,     'Dosen'],
    [D.publikasi.length, 'Publikasi'],
    [D.kegiatan.filter(k=>k.kategori==='penelitian').length, 'Penelitian'],
    [D.kegiatan.filter(k=>k.kategori==='pkm').length,        'Pengabdian'],
    [totalPrestasi,      'Prestasi mahasiswa'],
  ];
  document.getElementById('angka').innerHTML =
    angka.map(([v,l])=>`<div><b>${N(v)}</b><span>${l}</span></div>`).join('');

  const tahunPub = [...new Set(D.publikasi.map(p=>p.tahun))].sort((a,b)=>b-a);
  const tahunKeg = [...new Set(D.kegiatan.map(p=>p.tahun))].sort((a,b)=>b-a);
  const kelompok = [...new Set(D.kegiatan.map(k=>k.kelompok).filter(Boolean))].sort();

  document.getElementById('isi').innerHTML = `
    <section>
      <div class="bar">
        <h2>Publikasi</h2>
        <select id="fTahun"><option value="">Semua tahun</option>
          ${tahunPub.map(t=>`<option>${t}</option>`).join('')}</select>
        <select id="fTingkat"><option value="">Semua tingkat</option>
          <option value="internasional">Internasional</option>
          <option value="nasional">Nasional</option>
          <option value="wilayah_lokal">Wilayah / lokal</option></select>
        <input type="search" id="fCari" placeholder="Cari judul atau penulis">
      </div>
      <div class="list" id="lPub"></div>
    </section>

    <section>
      <div class="bar">
        <h2>Penelitian &amp; pengabdian</h2>
        <select id="kTahun"><option value="">Semua tahun</option>
          ${tahunKeg.map(t=>`<option>${t}</option>`).join('')}</select>
        <select id="kKat"><option value="">Semua jenis</option>
          <option value="penelitian">Penelitian</option>
          <option value="pkm">Pengabdian</option></select>
        <select id="kKel"><option value="">Semua sumber</option>
          ${kelompok.map(k=>`<option>${esc(k)}</option>`).join('')}</select>
      </div>
      <div class="list" id="lKeg"></div>
    </section>

    <section>
      <div class="bar"><h2>Prestasi mahasiswa</h2></div>
      <div class="list" id="lPres"></div>
    </section>

    <section>
      <div class="bar"><h2>Dosen</h2></div>
      <div class="list"><div class="dsn">${
        D.dosen.map(d=>`<div><b>${esc(d.nama)}</b>
          ${d.sinta_id?`<a href="https://sinta.kemdikbud.go.id/authors/profile/${esc(d.sinta_id)}" rel="noopener">SINTA</a>`:''}
          ${d.scopus_id?`<a href="https://www.scopus.com/authid/detail.uri?authorId=${esc(d.scopus_id)}" rel="noopener">Scopus</a>`:''}
          ${d.orcid?`<a href="https://orcid.org/${esc(d.orcid)}" rel="noopener">ORCID</a>`:''}
        </div>`).join('')}</div></div>
    </section>

    <footer>
      Diperbarui ${esc(D.diperbarui)}. Halaman ini hanya menampilkan data yang
      telah diverifikasi program studi. Beban kerja dosen, nominal pendanaan,
      dan identitas mahasiswa tidak dipublikasikan.
    </footer>`;

  ['fTahun','fTingkat','fCari'].forEach(id=>{
    const el = document.getElementById(id);
    el.addEventListener(id==='fCari'?'input':'change', pub);
  });
  ['kTahun','kKat','kKel'].forEach(id=>
    document.getElementById(id).addEventListener('change', keg));

  pub(); keg(); pres();
}

function pub(){
  const t = fTahun.value, g = fTingkat.value, q = fCari.value.trim().toLowerCase();
  const d = D.publikasi.filter(p =>
    (!t || String(p.tahun)===t) &&
    (!g || p.tingkat===g) &&
    (!q || (p.judul+' '+p.penulis.join(' ')).toLowerCase().includes(q)));

  lPub.innerHTML = d.length ? d.map(p=>`
    <div class="e">
      <div class="thn">${p.tahun}</div>
      <div class="e-b">
        <div class="e-j">${p.url
          ? `<a href="${esc(p.url)}" rel="noopener">${esc(p.judul)}</a>` : esc(p.judul)}</div>
        <div class="e-m">${[rapi(p.jenis), p.terbitan, p.doi && ('DOI '+p.doi)]
          .filter(Boolean).map(esc).join(' · ')}</div>
        ${p.penulis.length?`<div class="e-p">${p.penulis.map(esc).join(' · ')}</div>`:''}
      </div>
      <span class="pill">${esc(rapi(p.indeksasi || p.tingkat))}</span>
    </div>`).join('')
    : `<p class="kosong">Tidak ada publikasi yang cocok dengan penyaring ini.</p>`;
}

function keg(){
  const t = kTahun.value, k = kKat.value, kl = kKel.value;
  const d = D.kegiatan.filter(x =>
    (!t || String(x.tahun)===t) && (!k || x.kategori===k) && (!kl || x.kelompok===kl));

  lKeg.innerHTML = d.length ? d.map(x=>`
    <div class="e">
      <div class="thn">${x.tahun}</div>
      <div class="e-b">
        <div class="e-j">${esc(x.judul)}</div>
        <div class="e-m">${[rapi(x.tingkat), x.skema, x.mitra && ('mitra: '+x.mitra)]
          .filter(Boolean).map(esc).join(' · ')}</div>
        ${x.penulis.length?`<div class="e-p">${x.penulis.map(esc).join(' · ')}</div>`:''}
      </div>
      <span class="pill">${x.kategori==='pkm'?'Pengabdian':'Penelitian'}</span>
    </div>`).join('')
    : `<p class="kosong">Belum ada kegiatan terverifikasi.</p>`;
}

function pres(){
  const a = D.prestasi_agregat || [];
  lPres.innerHTML = a.length ? `
    <table><thead><tr>
      <th>Tahun</th><th>Tingkat</th><th>Bidang</th><th class="num">Jumlah</th>
    </tr></thead><tbody>${a.map(r=>`<tr>
      <td>${r.tahun}</td><td>${esc(rapi(r.tingkat))}</td>
      <td>${esc(rapi(r.bidang))}</td><td class="num">${r.jumlah}</td>
    </tr>`).join('')}</tbody></table>`
    : `<p class="kosong">Belum ada data prestasi.</p>`;
}
</script>
</body>
</html>
